title = "Ball Lightning secret scanning"

[extend]
useDefault = true

[[rules]]
id = "discord-client-secret"

  [[rules.allowlists]]
  description = "Skyscraper portfolio prose about a Discord community, not a client secret"
  condition = "AND"
  paths = ['''^messages/(en|sv|de|fr)\.json$''']
  regexTarget = "line"
  regexes = ['''^\s*"portfolio_skyscraper_og_description":''']
