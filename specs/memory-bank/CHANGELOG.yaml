  - date: "2026-06-10"
    version: "0.2.8.12"
    issue: "https://github.com/BallLightningAB/balllightning/pull/29"
    commit: f4cf593
    status: in-review
    title: "chore(security): finalize Dependabot configuration and security fixes"
    details: |-
      - Added Docker ecosystem to Dependabot with weekly schedule to match documented scope
      - Updated postcss override to ^8.5.15 to prevent vulnerable versions like 8.5.6
      - Removed tsconfig types array to allow automatic @types/* package inclusion
      - Commented out Dependabot assignees (organizations not supported by GitHub)
      - Resolved all Gemini Code Assist review comments for PR #29

      Refs: v0.2.8.12 #29

  - date: "2026-06-10"
    version: "0.2.8.11"
    issue: "https://github.com/BallLightningAB/balllightning/pull/29"
    commit: f449d87
    status: completed
    title: "chore(security): add Dependabot, SECURITY.md, secret-scan + fix transitive CVEs"
    details: |-
      - Added .github/dependabot.yml for weekly automated npm/GH Actions/Docker PRs
      - Bumped react-icons ^5.5.0 → ^5.6.0 (SiCss3 renamed to SiCss in 5.6.0; fixes TS build error)
      - Bumped vite ^7.3.1 → ^7.3.5 (patches 3 high CVEs)
      - Bumped vitest ^4.0.16 → ^4.1.8 (patches 1 critical CVE)
      - Added pnpm.overrides for 12 transitive packages: seroval, uuid, diff, undici, ws,
        shell-quote, rollup, picomatch, postcss, kysely, h3, minimatch
      - Regenerated pnpm-lock.yaml with overrides block so CI --frozen-lockfile passes
      - Added FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 job-level env to ci.yml
      - Fixed tsconfig.json vite/client type resolution: moved to src/vite-env.d.ts triple-slash ref
      - Vulnerability severity reduced: 55 → 18 (0 critical was 1, 10 high was 27)
      - Remaining 18 (seroval, kysely, srvx, uuid@10, h3 rc flags) locked as peer deps of
        @tanstack/react-start@1.145.7; require separate TanStack + Vite major upgrade

      Refs: v0.2.8.11 #29
