  - date: "2026-10-12"
    version: "0.2.8.16"
    issue: ""
    commit: 712e202987e448dbb62a1e7c9a90c01c64b3a2cd
    status: completed
    title: "fix(security): patch dependencies and enforce PR validation"
    details: |-
      - Reviewed and sequenced PRs #51, #47, and #46 with successful CI and production deployment between merges
      - Patched critical TanStack Start XSS and transitive dependency advisories; kept Ultracite 7.8.3 to avoid introducing vulnerable braces
      - Upgraded Nitro to 3.0.260903-beta for two advisories missed by pnpm audit; raised H3 override to 2.0.2 and removed an obsolete srvx override that rewrote peer ranges
      - Enabled blocking default Gitleaks scanning with a narrow verified portfolio-prose exception
      - Corrected the SARIF upload filename so successful scans also reach GitHub code scanning
      - Required up-to-date CI and Gitleaks on main and enabled Dependabot alerts/security updates
      - Pinned pnpm and Paraglide execution, reduced CI permissions, and added i18n, Vitest, and audit checks
      - Validated 11 tests, 393 translation keys across four locales, and 52 SSR routes; added reusable deployment smoke script

      Refs: v0.2.8.16 I3Fix I3Test I3Docs

  - date: "2026-07-02"
    version: "0.2.8.15"
    issue: ""
    commit: TBD
    status: completed
    title: "content(site): reposition Ball Lightning as maintained portfolio and archive"
    details: |-
      - Repositioned Ball Lightning around Nicolas Brulay's full-time Hultafors Group role as Product & Service Owner - Integrations
      - Updated homepage, capabilities, contact, portfolio, footer, metadata, and structured data away from active sales-oriented positioning
      - Removed the public message submission flow and direct email backend; contact now uses direct email/social channels
      - Added Chronomation archive route and reframed Chronomation as a paused archived concept
      - Removed old lead-capture and launch-oriented public surfaces
      - Limited the homepage Builder Coil feed to devlog/blog entries so older product/channel announcements are not serialized into the refreshed page
      - Localized root, homepage, and technologies metadata after external review flagged hardcoded English route metadata
      - Validated Paraglide, i18n, typecheck, lint, test, build, sitemap, SSR routes, and stale-term sweep
      - Updated PDD to version 1.2 and ignored the local AI renovation package

      Refs: v0.2.8.15 I30D1 I30D2 I30D3 I30D4 I30D5 I30D6

