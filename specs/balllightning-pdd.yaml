balllightning_pdd:
  meta:
    name: "Ball Lightning AB - Site PDD"
    code_name: "balllightning-pdd"
    version: "1.2"
    repo: "https://github.com/BallLightningAB/balllightning"
    domain: "https://balllightning.cloud"
    github_project: "https://github.com/users/BallLightningAB/projects/9"
    owner:
      individual: "Nicolas Brulay"
      company: "Ball Lightning AB"
    shared_references:
      ecosystem_pdd: "https://github.com/BallLightningAB/brand-system/blob/main/shared-ecosystem-pdd.yaml"
      architecture: "https://github.com/BallLightningAB/brand-system/blob/main/shared-architecture.yaml"
      design_system: "https://github.com/BallLightningAB/brand-system/blob/main/shared-design-system.yaml"
      brand_assets: "https://github.com/BallLightningAB/brand-system/tree/main/brand-assets"

  product:
    kind: "company_site"
    description: >-
      Maintained company presence, selected-work portfolio, and project archive
      for Ball Lightning AB. The site remains online as a reference point for
      previous work, technical capabilities, and selected non-competing side
      projects.
    positioning: >-
      Nicolas Brulay works full-time at Hultafors Group as Product & Service
      Owner - Integrations. Ball Lightning AB remains maintained on a limited
      basis as a company presence, portfolio, and archive, but is not currently
      used to accept new client engagements.
    public_focus:
      - "integration ownership"
      - "integration modernization"
      - "harmonization"
      - "integration strategy"
      - "AI and automation"
      - "technical capability development"

  techstack:
    framework: "TanStack Start (Router + Loaders + Server Functions)"
    runtime: "Vercel (Node)"
    language: "TypeScript"
    styling:
      css: "TailwindCSS v4"
      ui: "shadcn/ui, Lucide icons, Motion"
    tooling:
      lint_format: ["Biome", "Ultracite"]
      hosting: "Vercel"
    i18n:
      library: "Paraglide JS v2"
      locales: ["en", "sv", "de", "fr"]
      default_locale: "en"
      strategy: ["url", "cookie", "preferredLanguage", "baseLocale"]
      url_pattern: "always-prefixed (/{locale}/...)"
      ssr: "paraglideMiddleware in src/server.ts"
      translations: "messages/{locale}.json"
      qa_script: "pnpm i18n:check"
    analytics:
      provider: "GA4 and Vercel Web Analytics, consent-gated"
      default: "off until explicit analytics consent"

  design:
    brand: "balllightning"
    color_reference: "shared-design-system.yaml#design.shared.color_schemes.balllightning"
    typography_reference: "shared-design-system.yaml#design.shared.typography"
    key_colors:
      dark:
        background_base: "#05070A"
        background_elevated: "#0A1014"
        foreground_body: "#E5E7EB"
        heading_cream: "#F5E6D3"
        deep_molten: "#9C1B12"
        mid_red: "#DD3A28"
        warm_rose: "#FF7268"
        pale_ember: "#FFD4C9"
        gradient: "linear-gradient(135deg, #DD3A28, #FF7268)"
      light:
        background_base: "#F5E6D3"
        foreground_primary: "#111827"
        deep_molten: "#9C1B12"
        mid_red: "#DD3A28"

  routes:
    required:
      - path: "/"
        purpose: "Home with company status, founder context, GitHub activity, and recent Builder Coil notes"
      - path: "/services"
        purpose: "Compatibility route reframed as previous work and selected capabilities"
      - path: "/portfolio"
        purpose: "Portfolio index with selected previous work and archived concepts"
      - path: "/chronomation"
        purpose: "Public archive note for the paused Chronomation concept"
      - path: "/contact"
        purpose: "Static direct-contact page with email and social links"
      - path: "/privacy"
        purpose: "Privacy, cookies, and analytics consent documentation"
    optional:
      - path: "/portfolio/:slug"
        purpose: "Individual project notes and case studies"

  content:
    capabilities:
      framing: "Previous work and selected capabilities, not an active catalogue"
      areas:
        - "Integration and technical ownership"
        - "Web and application delivery"
        - "AI and automation"
    portfolio:
      projects:
        - slug: "chronomation"
          title: "Chronomation - archived concept"
          status: "paused"
          route: "/chronomation"
        - slug: "the-builder-coil"
          title: "The Builder Coil - personal devlog and content system"
          status: "maintained separately"
        - slug: "shipping-api-dojo"
          title: "Shipping API Dojo - carrier API tutorial platform"
        - slug: "jorild-se"
          title: "Jorild.se - modern bilingual clinic website"
        - slug: "blightfell"
          title: "Blightfell - Web3 game integration"
        - slug: "skyscraper"
          title: "Skyscraper - strategic MMO deckbattler"
    builder_coil_feed:
      description: "Embed recent TBC notes on homepage via public endpoint"
      behavior: "Cards link to canonical URLs on thebuildercoil.com"
      fallback: "Graceful degradation if endpoint unavailable"

  policies:
    public_positioning:
      rule: "Ball Lightning remains maintained, but is not positioned as accepting new client work"
    content_syndication:
      rule: "Preview cards only, link to canonical TBC URLs, no full content duplication"
      reference: "shared-design-system.yaml#cross_brand_policies.content_syndication"
    secrets:
      rule: "All values in Vercel env vars, public repo expected"
    contact:
      rule: "No site form; use direct email or social links only"
